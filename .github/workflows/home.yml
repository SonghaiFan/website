name: Deploy homepage
on:
  workflow_run:
    workflows: [Check website]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/pages.yml
    with:
      target: home
      web_ref: ${{ github.event.workflow_run.head_sha || '' }}
